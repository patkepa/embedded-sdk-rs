[package]
name = "xiao-esp32c6-azure-iot"
description = "Experimental Azure IoT Hub reference firmware for Seeed Studio XIAO ESP32C6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xiao-esp32c6-azure-iot"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embassy-executor.workspace = true
embassy-net.workspace = true
embassy-time.workspace = true
embedded-sdk-board-xiao-esp32c6.workspace = true
embedded-sdk-cloud-azure-iot.workspace = true
embedded-sdk-mqtt-v311.workspace = true
embedded-sdk-networking-embassy-net.workspace = true
embedded-sdk-platform-esp32c6 = { workspace = true, features = ["hardware-rng", "wifi"] }
embedded-sdk-security.workspace = true
embedded-sdk-wifi.workspace = true
esp-alloc = { workspace = true, features = ["compat", "esp32c6", "global-allocator"] }
esp-backtrace = { workspace = true, features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c6"] }
esp-hal = { workspace = true, features = [
    "esp32c6",
    "exception-handler",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["esp32c6"] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32c6",
] }
getrandom.workspace = true
static_cell.workspace = true

[lints]
workspace = true
