[package]
name = "xiao-esp32c6-beacon-scanner"
description = "BLE advertisement scanner firmware for Seeed Studio XIAO ESP32C6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xiao-esp32c6-beacon-scanner"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-sdk-board-xiao-esp32c6.workspace = true
embedded-sdk-platform-esp32c6 = { workspace = true, features = ["bluetooth"] }
esp-alloc = { workspace = true, features = ["compat", "esp32c6", "global-allocator"] }
esp-backtrace = { workspace = true, features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c6"] }
esp-hal = { workspace = true, features = [
    "esp32c6",
    "exception-handler",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["esp32c6"] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32c6",
] }
trouble-host = { workspace = true, features = [
    "central",
    "default-packet-pool",
    "default-packet-pool-mtu-27",
    "default-packet-pool-size-2",
    "scan",
] }

[lints]
workspace = true
