[package]
name = "embedded-sdk-platform-esp32c6"
description = "ESP32-C6 platform integration for embedded-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["bluetooth", "coex", "wifi"]
bluetooth = ["dep:embedded-sdk-bluetooth", "esp-radio/ble"]
coex = ["bluetooth", "esp-radio/coex", "wifi"]
hardware-rng = ["dep:embedded-sdk-security", "dep:getrandom"]
wifi = ["dep:embedded-sdk-wifi", "esp-radio/wifi"]

[dependencies]
embedded-sdk-bluetooth = { workspace = true, optional = true }
embedded-sdk-core.workspace = true
embedded-sdk-security = { workspace = true, optional = true }
embedded-sdk-wifi = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { workspace = true, features = ["esp32c6", "requires-unstable"] }
esp-radio = { workspace = true, features = [
    "esp-alloc",
    "esp32c6",
    "unstable",
] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32c6",
] }

[lints]
workspace = true
